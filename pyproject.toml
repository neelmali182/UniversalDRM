[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-drm"
version = "0.1.0"
description = "Browser-first content protection and capture-resistant sharing platform."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    # Rendering (existing)
    "Pillow>=10.1",
    "pypdfium2>=4.20,<6",
    # Cryptography
    "cryptography>=42.0",
    # API framework
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    # HTTP client (SDK)
    "httpx>=0.27",
    # Async task queue
    "celery>=5.3",
    "redis>=5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]
demo = ["Flask>=3"]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/neelmali182/UniversalDRM"

[project.scripts]
udrm = "universal_drm.cli:main"
universal-drm = "universal_drm.cli:main"

[tool.setuptools]
packages = [
    "universal_drm",
    "packages.core",
    "packages.crypto",
    "packages.policy_engine",
    "packages.storage",
    "packages.audit",
    "packages.watermark",
    "packages.renderers",
    "apps.api",
    "apps.api.middleware",
    "apps.api.routes",
    "apps.api.services",
    "sdk.python",
]

[tool.setuptools.package-data]
universal_drm = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
